<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>페르소나 상세 - 페르소나 자기소개</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <!-- 섹션 1: 이름, 설명, 생성일, 태그 -->
    <section id="persona-detail" class="page-section"></section>

    <!-- 섹션 2: 경험 기록 목록 -->
    <section class="page-section">
      <h2>경험 기록</h2>
      <!-- 정렬 버튼 + 태그 필터 -->
      <div class="toolbar">
        <div id="sort-buttons"></div>
        <div id="experience-tag-filter"></div>
      </div>
      <div id="experience-list" class="grid" style="margin-top:16px"></div>
      <p style="text-align:center; margin-top:16px">
        <button id="more-btn" class="btn" hidden>더보기</button>
      </p>
      <!-- 더보기 이후 10개씩 페이지 이동 버튼 -->
      <div id="pager" class="pager" hidden></div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>renderPersonaDetail();</script>
</body>
</html>
